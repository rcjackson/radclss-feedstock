{% set version = "2026.9.16.1" %}

package:
  name: radclss
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/r/radclss/radclss-{{ version }}.tar.gz
  sha256: 05044bd6d77d7e17be268df861834ff3b42216b9076b13e29deb2ac7667fdc15

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  build:
    - python
    - pip
  host:
    - python
    - pip
    - setuptools
    - numpy <2.4.0
  run:
    - python >={{ python_min }}
    - act-atmos
    - arm_pyart
    - numpy <2.4.0
    - xarray
    - pandas
    - matplotlib-base
    - pip
    - boto3
    - xradar
    - dask

test:
  requires:
    - python {{ python_min }}
    - pytest
    - arm_pyart
    - pip
    - ca-certificates
  source_files:
    - tests/
  imports:
    - radclss
  commands:
    # 1. On Linux & macOS: Point botocore to the correct Conda CA bundle path
    - export AWS_CA_BUNDLE="${CONDA_PREFIX}/ssl/cacert.pem"       # [not win]
    - export REQUESTS_CA_BUNDLE="${CONDA_PREFIX}/ssl/cacert.pem"   # [not win]
    - pytest tests/test_column_utils.py tests/test_config.py

about:
  home: https://github.com/ARM-Development/radclss
  summary: 'Radar Columns and In Situ Sensors'
  description: |
    RADclss is a utility for developing vertical columns from CF/Radial compliant radar scans, co-located with ARM ground based instruments. 
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rcjackson
